<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گزارش‌ها - V2ray Collector</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <h1>🛡️ V2ray Collector</h1>
                    <p class="subtitle">گزارش‌ها</p>
                </div>
                <nav class="nav">
                    <a href="/">خانه</a>
                    <a href="/dashboard">داشبورد</a>
                    <a href="/configs">کانفیگ‌ها</a>
                    <a href="/reports" class="active">گزارش‌ها</a>
                    <a href="/test">تست دستی</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main reports-page">
            <!-- Page Header -->
            <section class="page-header">
                <h2>گزارش‌ها</h2>
                <p>لیست همه گزارش‌های تولید شده</p>
            </section>

            <!-- Reports List -->
            <section class="reports-section">
                <div class="reports-list" id="reports-list">
                    <div class="loading">در حال بارگذاری...</div>
                </div>
            </section>

            <!-- Report Viewer -->
            <section class="report-viewer" id="report-viewer" style="display: none;">
                <div class="viewer-header">
                    <h3 id="viewer-title">گزارش</h3>
                    <button class="btn btn-secondary" onclick="closeReport()">بستن</button>
                </div>
                <div class="viewer-content" id="viewer-content"></div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>V2ray Collector v2.0 | ساخت: ramin00542</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // Load reports on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadReports();
        });
        
        // Load reports
        async function loadReports() {
            try {
                const reports = await api.getReports();
                renderReports(reports);
            } catch (error) {
                console.error('Error loading reports:', error);
                document.getElementById('reports-list').innerHTML = '<p class="text-danger">خطا در بارگذاری گزارش‌ها</p>';
            }
        }
        
        // Render reports
        function renderReports(reports) {
            const container = document.getElementById('reports-list');
            if (!container) return;
            
            if (!reports || reports.length === 0) {
                container.innerHTML = '<p class="text-secondary">هیچ گزارشی یافت نشد</p>';
                return;
            }
            
            // Sort by date (newest first)
            reports.sort((a, b) => new Date(b.mod_time) - new Date(a.mod_time));
            
            let html = '<div class="reports-grid">';
            reports.forEach(report => {
                const date = new Date(report.mod_time).toLocaleString('fa-IR');
                const name = report.name;
                const size = formatFileSize(report.size);
                const isMarkdown = name.endsWith('.md');
                const isJSON = name.endsWith('.json');
                
                html += `
                    <div class="report-card" onclick="viewReport('${name}')">
                        <div class="report-header">
                            <div class="report-icon">${isMarkdown ? '📄' : isJSON ? '📋' : '📁'}</div>
                            <div class="report-name">${name}</div>
                        </div>
                        <div class="report-meta">
                            <span class="report-date">${date}</span>
                            <span class="report-size">${size}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // View report
        async function viewReport(name) {
            const viewer = document.getElementById('report-viewer');
            const content = document.getElementById('viewer-content');
            const title = document.getElementById('viewer-title');
            
            title.textContent = name;
            viewer.style.display = 'block';
            
            try {
                const response = await fetch(`/reports/${name}`);
                if (!response.ok) {
                    throw new Error('Failed to load report');
                }
                
                const text = await response.text();
                
                if (name.endsWith('.md')) {
                    // Render markdown as HTML
                    content.innerHTML = `<pre class="markdown-content">${escapeHtml(text)}</pre>`;
                } else if (name.endsWith('.json')) {
                    // Format JSON
                    try {
                        const json = JSON.parse(text);
                        content.innerHTML = `<pre class="code-block">${JSON.stringify(json, null, 2)}</pre>`;
                    } catch (e) {
                        content.innerHTML = `<pre class="code-block">${escapeHtml(text)}</pre>`;
                    }
                } else {
                    content.innerHTML = `<pre class="code-block">${escapeHtml(text)}</pre>`;
                }
            } catch (error) {
                content.innerHTML = `<p class="text-danger">خطا در بارگذاری گزارش: ${error.message}</p>`;
            }
        }
        
        // Close report viewer
        function closeReport() {
            document.getElementById('report-viewer').style.display = 'none';
        }
        
        // Format file size
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Add CSS for reports
        const style = document.createElement('style');
        style.textContent = `
            .reports-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }
            
            .report-card {
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: var(--radius);
                padding: 1rem;
                cursor: pointer;
                transition: var(--transition);
            }
            
            .report-card:hover {
                background: rgba(99, 102, 241, 0.1);
                border-color: var(--primary-color);
                transform: translateY(-2px);
            }
            
            .report-header {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
            }
            
            .report-icon {
                font-size: 1.5rem;
            }
            
            .report-name {
                font-weight: 500;
                font-size: 0.9rem;
                word-break: break-all;
            }
            
            .report-meta {
                display: flex;
                justify-content: space-between;
                font-size: 0.8rem;
                color: var(--text-secondary);
            }
            
            .viewer-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 1rem;
                border-bottom: 1px solid var(--card-border);
                margin-bottom: 1rem;
            }
            
            .viewer-content {
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: var(--radius);
                padding: 1.5rem;
                max-height: 500px;
                overflow-y: auto;
            }
            
            .markdown-content {
                white-space: pre-wrap;
                word-wrap: break-word;
                font-family: inherit;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
